name: Release Standalone Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: devsetup-windows-amd64.exe
            binary_path: dist/devsetup.exe
          - os: ubuntu-latest
            artifact_name: devsetup-linux-amd64
            binary_path: dist/devsetup
          - os: macos-latest
            artifact_name: devsetup-macos-universal
            binary_path: dist/devsetup

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .

      - name: Compile standalone binary
        run: |
          pyinstaller --onefile --name devsetup --clean src/devsetup/cli/main.py

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.binary_path }}

